<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Jemaat GKE Efrata</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#263238;padding:14px}
.container{max-width:1400px;margin:auto}
header,.panel,.card,.table-wrap{background:#fff;border-radius:14px;box-shadow:0 3px 15px #00000012}
header{padding:20px;margin-bottom:14px}
h1{font-size:25px;color:#17324d}
.subtitle{color:#78909c;font-size:13px;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.card{padding:16px;text-align:center}
.card .label{font-size:12px;color:#78909c;text-transform:uppercase}
.card .value{font-size:26px;font-weight:800;color:#1976d2;margin-top:4px}
nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}
nav button{border:0;background:#e8eef5;color:#34495e;padding:11px 16px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.active{background:#1976d2;color:#fff}
.panel{padding:16px;margin-bottom:14px}
.controls{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:11px 13px;border:1px solid #ccd6df;border-radius:9px;font-size:14px;background:#fff}
input{flex:1;min-width:220px}
button.action{padding:11px 15px;border:0;border-radius:9px;background:#1976d2;color:white;cursor:pointer}
button.action.secondary{background:#607d8b}
.status{margin:10px 0;padding:10px;border-radius:8px;font-size:13px;display:none}
.status.show{display:block}.status.loading{background:#e3f2fd;color:#1565c0}.status.error{background:#ffebee;color:#c62828}.status.success{background:#e8f5e9;color:#2e7d32}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 12px;border-bottom:1px solid #e8edf1;text-align:left;font-size:13px}
th{background:#f7f9fb;color:#455a64;position:sticky;top:0;z-index:2}
tr:hover td{background:#f8fbff}.family-row td{background:#eaf3ff!important;color:#174a7a;font-size:13px;border-top:2px solid #c9def3}.family-row .badge{float:right}
.empty{text-align:center;padding:40px;color:#90a4ae}
.pagination{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px}
.pagination button{border:0;padding:8px 11px;border-radius:7px;background:#e4eaf0;cursor:pointer}
.pagination button.active{background:#1976d2;color:#fff}
.family-grid,.env-grid,.birthday-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.group{border:1px solid #e2e8ee;border-radius:12px;padding:14px;background:#fff}
.group h3{font-size:16px;color:#263238;margin-bottom:7px}
.group .meta{font-size:12px;color:#78909c;margin-bottom:10px}
.member{padding:7px 0;border-top:1px solid #edf1f4;font-size:13px}
.member b{display:block}
.badge{display:inline-block;padding:3px 7px;border-radius:20px;background:#e8f2ff;color:#1565c0;font-size:11px}
.section-title{font-size:18px;font-weight:750;margin-bottom:12px;color:#17324d}
.month-title{font-size:14px;color:#546e7a;margin:15px 0 8px;font-weight:700}
.hidden{display:none}
@media(max-width:700px){
body{padding:8px}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:20px}
.card .value{font-size:22px}nav button{padding:9px 12px}.panel{padding:12px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📋 Data Jemaat GKE Efrata</h1>
<div class="subtitle">Dashboard data jemaat • seluruh data dimuat bertahap dari Supabase</div>
</header>

<div class="stats" id="stats"></div>

<nav>
<button class="active" data-view="all">👥 Semua Jemaat</button>
<button data-view="family">👨‍👩‍👧‍👦 Per Keluarga</button>
<button data-view="birthday">🎂 Ulang Tahun</button>
<button data-view="marriage">💍 Pernikahan</button>
</nav>

<div class="panel">
<div class="controls">
<input id="search" placeholder="Cari nama, no registrasi, alamat, lingkungan..." autocomplete="off">
<button class="action secondary" onclick="resetFilters()">Reset</button>
<button class="action" onclick="loadAllData()">🔄 Refresh</button>
</div>
<div id="status" class="status"></div>
</div>

<section id="view-all">
<div class="section-title">Daftar Jemaat</div>
<div class="table-wrap">
<table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
<div id="empty" class="empty hidden">Tidak ada data.</div>
</div>
<div id="pagination" class="pagination"></div>
</section>

<section id="view-family" class="hidden">
<div class="section-title">Data Per Keluarga</div>
<div id="familyInfo" class="status show success"></div>
<div id="families" class="family-grid"></div>
</section>



<section id="view-birthday" class="hidden">
<div class="section-title">🎂 Ulang Tahun</div>
<div id="birthdays"></div>
</section>

<section id="view-marriage" class="hidden">
<div class="section-title">💍 Ulang Tahun Pernikahan</div>
<div id="marriages"></div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";

const SUPABASE_URL="https://gpgjgplqsvyexumoljyo.supabase.co";
const SUPABASE_KEY="sb_publishable_JaVgg3CuVmI9SczGkoaRZQ_EaYoV9z9";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allData=[];
let filtered=[];
let page=1;
const PER_PAGE=25;
let currentView="all";

const labels={
id:"ID",no_reg:"No. Registrasi",nama:"Nama",jk:"JK",
tpt_lhr:"Tempat Lahir",tgl_lhr:"Tanggal Lahir",
tpt_nkh:"Tempat Nikah",tgl_nkh:"Tanggal Nikah",
alamat:"Alamat",ling_pel:"Lingkungan Pelayanan",status:"Status"
};

const $=id=>document.getElementById(id);

function showStatus(msg,type="success"){
const el=$("status");el.textContent=msg;el.className="status show "+type;
}
function esc(v){
const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML;
}
function dateObj(v){
if(v==null||String(v).trim()==="")return null;
let x=String(v).trim();
if(x==="0000-00-00"||x==="0000-00-00 00:00:00")return null;
let m;
if((m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
if((m=x.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/))) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
const d=new Date(x);
return isNaN(d)?null:d;
}
function dateID(v){
const d=dateObj(v);return d?d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}):"-";
}
function age(v){
const d=dateObj(v);if(!d)return "-";
const n=new Date();let a=n.getFullYear()-d.getFullYear();
const m=n.getMonth()-d.getMonth();
if(m<0||(m===0&&n.getDate()<d.getDate()))a--;
return a;
}

/* Supabase REST/PostgREST biasanya mengembalikan maksimal 1000 baris.
   Kita ambil bertahap menggunakan range() sampai batch terakhir. */
async function loadAllData(){
showStatus("Memuat seluruh data jemaat...","loading");
allData=[];
let from=0,batch=1000;
try{
while(true){
const {data,error}=await db.from("jemaat")
.select("*").order("id",{ascending:true}).range(from,from+batch-1);
if(error)throw error;
const rows=data||[];
allData.push(...rows);
showStatus("Memuat data... "+allData.length+" data","loading");
if(rows.length<batch)break;
from+=batch;
}
filtered=[...allData];page=1;
updateStats();
renderAll();
renderFamilies();
renderBirthdays();
renderMarriages();
showStatus("Berhasil memuat "+allData.length.toLocaleString("id-ID")+" data.","success");
}catch(e){
console.error(e);
showStatus("Gagal memuat data: "+e.message,"error");
}
}

function updateStats(){
const total=allData.length;
const l=allData.filter(x=>String(x.jk||"").toUpperCase()==="L").length;
const p=allData.filter(x=>String(x.jk||"").toUpperCase()==="P").length;
const env=new Set(allData.map(x=>String(x.ling_pel||"").trim()).filter(Boolean)).size;
$("stats").innerHTML=
`<div class="card"><div class="label">Total Jemaat</div><div class="value">${total.toLocaleString("id-ID")}</div></div>
<div class="card"><div class="label">Laki-laki</div><div class="value">${l.toLocaleString("id-ID")}</div></div>
<div class="card"><div class="label">Perempuan</div><div class="value">${p.toLocaleString("id-ID")}</div></div>
<div class="card"><div class="label">Lingkungan</div><div class="value">${env}</div></div>`;
}

function applyFilters(){
const q=$("search").value.toLowerCase().trim();
filtered=allData.filter(row=>{
const okQ=!q||Object.values(row).some(v=>String(v??"").toLowerCase().includes(q));
return okQ;
});
page=1;renderAll();
}

function renderAll(){
const rows=filtered;
if(!rows.length){
$("thead").innerHTML="";$("tbody").innerHTML="";
$("empty").classList.remove("hidden");$("pagination").innerHTML="";return;
}
$("empty").classList.add("hidden");

const headers=Object.keys(rows[0]);
$("thead").innerHTML=headers.map(h=>`<th>${esc(labels[h]||h)}</th>`).join("");

const start=(page-1)*PER_PAGE;
const pageRows=rows.slice(start,start+PER_PAGE);

let html="";
let lastFamily="__FIRST__";
pageRows.forEach(r=>{
const family=familyKey(r);
if(family!==lastFamily){
html+=`<tr class="family-row"><td colspan="${headers.length}">
<strong>👨‍👩‍👧‍👦 Keluarga / No. Registrasi: ${esc(family)}</strong>
<span class="badge">Anggota: ${rows.filter(x=>familyKey(x)===family).length}</span>
</td></tr>`;
lastFamily=family;
}
html+=`<tr>${headers.map(h=>{
const v=r[h];
return `<td>${v==null||v===""||v==="0000-00-00"?"-":esc(h.includes("tgl_")?dateID(v):v)}</td>`;
}).join("")}</tr>`;
});
$("tbody").innerHTML=html;
renderPagination(Math.ceil(rows.length/PER_PAGE));
}
function renderPagination(total){
let html="";
if(total<=1){$("pagination").innerHTML="";return}
html+=`<button onclick="gotoPage(1)">«</button><button onclick="gotoPage(${Math.max(1,page-1)})">‹</button>`;
let s=Math.max(1,page-2),e=Math.min(total,page+2);
for(let i=s;i<=e;i++)html+=`<button class="${i===page?"active":""}" onclick="gotoPage(${i})">${i}</button>`;
html+=`<button onclick="gotoPage(${Math.min(total,page+1)})">›</button><button onclick="gotoPage(${total})">»</button>`;
$("pagination").innerHTML=html;
}
window.gotoPage=function(n){
const total=Math.ceil(filtered.length/PER_PAGE);if(n<1||n>total)return;
page=n;renderAll();window.scrollTo({top:0,behavior:"smooth"});
};

/* Keluarga dikelompokkan berdasarkan No. Registrasi.
   Anggota dengan nomor registrasi yang sama dianggap satu keluarga. */
function familyKey(r){
const reg=String(r.no_reg??"").trim();
if(!reg)return "Belum ada nomor registrasi";
return reg;
}
function renderFamilies(){
const map=new Map();
allData.forEach(r=>{const k=familyKey(r);if(!map.has(k))map.set(k,[]);map.get(k).push(r)});
const arr=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"id"));
$("familyInfo").textContent=`Ditemukan ${arr.length.toLocaleString("id-ID")} kelompok keluarga. Dasar pengelompokan: No. Registrasi.`;

$("families").innerHTML=arr.map(([k,members])=>{
const headers=Object.keys(members[0]);
return `<div class="group">
<h3>👨‍👩‍👧‍👦 No. Registrasi: ${esc(k)}</h3>
<div class="meta">${members.length} anggota</div>
<div class="table-wrap" style="box-shadow:none;border:1px solid #e7edf2">
<table><thead><tr>${headers.map(h=>`<th>${esc(labels[h]||h)}</th>`).join("")}</tr></thead>
<tbody>${members.map(m=>`<tr>${headers.map(h=>{
const v=m[h];
return `<td>${v==null||v===""||v==="0000-00-00"?"-":esc(h.includes("tgl_")?dateID(v):v)}</td>`;
}).join("")}</tr>`).join("")}</tbody></table>
</div></div>`;
}).join("");
}
function renderBirthdays(){
const today=new Date();
const rows=allData.filter(r=>dateObj(r.tgl_lhr))
.sort((a,b)=>{
const da=dateObj(a.tgl_lhr),db=dateObj(b.tgl_lhr);
const ma=(da.getMonth()-today.getMonth()+12)%12, mb=(db.getMonth()-today.getMonth()+12)%12;
return ma-mb || da.getDate()-db.getDate();
});
const current=rows.filter(r=>dateObj(r.tgl_lhr).getMonth()===today.getMonth());
const upcoming=rows.filter(r=>dateObj(r.tgl_lhr).getMonth()!==today.getMonth());
const card=r=>`<div class="group"><h3>${esc(r.nama||"-")}</h3>
<div class="meta">🎂 ${dateID(r.tgl_lhr)} • Usia ${age(r.tgl_lhr)} tahun</div>
<div class="member">${esc(r.ling_pel||"Lingkungan belum diisi")}</div></div>`;
$("birthdays").innerHTML=`
<div class="month-title">🎂 Bulan Ini — ${current.length} orang</div>
<div class="birthday-grid">${current.length?current.map(card).join(""):'<div class="empty">Tidak ada ulang tahun bulan ini.</div>'}</div>
<div class="month-title">📅 Ulang Tahun Berikutnya</div>
<div class="birthday-grid">${upcoming.slice(0,100).length?upcoming.slice(0,100).map(card).join(""):'<div class="empty">Tidak ada data tanggal lahir.</div>'}</div>`;
}
function renderMarriages(){
const today=new Date();
const rows=allData.filter(r=>dateObj(r.tgl_nkh))
.sort((a,b)=>{
const da=dateObj(a.tgl_nkh),db=dateObj(b.tgl_nkh);
const ma=(da.getMonth()-today.getMonth()+12)%12, mb=(db.getMonth()-today.getMonth()+12)%12;
return ma-mb || da.getDate()-db.getDate();
});
const current=rows.filter(r=>dateObj(r.tgl_nkh).getMonth()===today.getMonth());
const upcoming=rows.filter(r=>dateObj(r.tgl_nkh).getMonth()!==today.getMonth());
const card=r=>{
const d=dateObj(r.tgl_nkh);
const years=Math.max(0,today.getFullYear()-d.getFullYear()-(today.getMonth()<d.getMonth()||(today.getMonth()===d.getMonth()&&today.getDate()<d.getDate())?1:0));
return `<div class="group"><h3>${esc(r.nama||"-")}</h3>
<div class="meta">💍 ${dateID(r.tgl_nkh)} • ${years} tahun pernikahan</div>
<div class="member">${esc(r.tpt_nkh||"")} ${r.ling_pel?"• "+esc(r.ling_pel):""}</div></div>`;
};
$("marriages").innerHTML=`
<div class="month-title">💍 Bulan Ini — ${current.length} data</div>
<div class="birthday-grid">${current.length?current.map(card).join(""):'<div class="empty">Tidak ada ulang tahun pernikahan bulan ini.</div>'}</div>
<div class="month-title">📅 Ulang Tahun Pernikahan Berikutnya</div>
<div class="birthday-grid">${upcoming.slice(0,100).length?upcoming.slice(0,100).map(card).join(""):'<div class="empty">Tidak ada data tanggal pernikahan.</div>'}</div>`;
}
function switchView(view){
currentView=view;
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
["all","family","birthday","marriage"].forEach(v=>$("view-"+v).classList.toggle("hidden",v!==view));
if(view==="all")applyFilters();
}

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));
$("search").addEventListener("input",applyFilters);
window.resetFilters=function(){$("search").value="";filtered=[...allData];page=1;renderAll()};
window.loadAllData=loadAllData;

loadAllData();
})();
</script>
</body>
</html>
