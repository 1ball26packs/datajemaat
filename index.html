<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Jemaat - Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 1rem;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
        }

        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }

        button {
            padding: 0.75rem 1.5rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        .status-message {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .status-message.loading {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }

        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }

        .table-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #e9ecef;
            white-space: nowrap;
            user-select: none;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #e9ecef;
            color: #555;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr.highlight {
            background: #fff3cd;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1.5rem;
            background: white;
            margin-top: 1rem;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 0.5rem 0.75rem;
            min-width: 40px;
        }

        .pagination button.active {
            background: #2c3e50;
        }

        .pagination button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card .label {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: #3498db;
        }

        @media (max-width: 768px) {
            header {
                padding: 1rem;
            }

            h1 {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: 100%;
            }

            th, td {
                padding: 0.5rem;
                font-size: 13px;
            }

            table {
                font-size: 12px;
            }
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Data Jemaat GKE Efrata</h1>
            <p class="subtitle">Data congregational members - Updated: <span id="update-time">-</span></p>
        </header>

        <div class="stats" id="stats-container"></div>

        <div class="controls">
            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Cari nama, no_reg, alamat... (live search)"
                    autocomplete="off"
                >
            </div>
            <button onclick="window.dataApp.resetSearch()">Reset</button>
            <button onclick="window.dataApp.refreshData()">🔄 Refresh</button>
        </div>

        <div id="status-message" class="status-message"></div>

        <div class="table-wrapper">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>Tidak ada data</p>
            </div>
        </div>

        <div class="pagination" id="pagination-controls"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // IIFE - Isolated scope to prevent duplicate declaration
        (function() {
            const SUPABASE_URL = 'https://gpgjgplqsvyexumoljyo.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_JaVgg3CuVmI9SczGkoaRZQ_EaYoV9z9';
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let allData = [];
            let filteredData = [];
            let currentPage = 1;
            const itemsPerPage = 20;

            const columnLabels = {
                id: 'ID',
                no_reg: 'No. Registrasi',
                nama: 'Nama',
                jk: 'JK',
                tpt_lhr: 'Tempat Lahir',
                tgl_lhr: 'Tanggal Lahir',
                tpt_nkh: 'Tempat Nikah',
                tgl_nkh: 'Tanggal Nikah',
                alamat: 'Alamat',
                ling_pel: 'Lingkungan Pelayanan',
                status: 'Status'
            };

            async function loadData() {
                showStatus('Memuat data...', 'loading');
                try {
                    const { data, error } = await supabase
                        .from('jemaat')
                        .select('*')
                        .order('id', { ascending: true });

                    if (error) throw error;

                    allData = data || [];
                    filteredData = [...allData];
                    currentPage = 1;
                    
                    renderTable();
                    updateStats();
                    updateLastUpdate();
                    showStatus('Data berhasil dimuat', 'success', 2000);
                } catch (error) {
                    console.error('Error:', error);
                    showStatus(`Error: ${error.message}`, 'error');
                }
            }

            function renderTable() {
                const thead = document.getElementById('table-head');
                const tbody = document.getElementById('table-body');
                const emptyState = document.getElementById('empty-state');

                if (filteredData.length === 0) {
                    emptyState.style.display = 'block';
                    thead.innerHTML = '';
                    tbody.innerHTML = '';
                    document.getElementById('pagination-controls').innerHTML = '';
                    return;
                }

                emptyState.style.display = 'none';

                const headers = Object.keys(filteredData[0]);
                thead.innerHTML = headers.map(header => 
                    `<th>${columnLabels[header] || header}</th>`
                ).join('');

                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                const pageData = filteredData.slice(start, end);

                tbody.innerHTML = pageData.map(row => 
                    `<tr>${headers.map(header => {
                        let value = row[header];
                        if (value === null || value === undefined || value === '0000-00-00' || value === '') {
                            return '<td>-</td>';
                        }
                        return `<td>${escapeHtml(String(value))}</td>`;
                    }).join('')}</tr>`
                ).join('');

                renderPagination();
            }

            function renderPagination() {
                const totalPages = Math.ceil(filteredData.length / itemsPerPage);
                const controls = document.getElementById('pagination-controls');

                if (totalPages <= 1) {
                    controls.innerHTML = '';
                    return;
                }

                let html = '<button onclick="window.dataApp.goToPage(1)" ' + (currentPage === 1 ? 'disabled' : '') + '>«</button>';
                html += '<button onclick="window.dataApp.goToPage(' + (currentPage - 1) + ')" ' + (currentPage === 1 ? 'disabled' : '') + '>‹</button>';

                const startPage = Math.max(1, currentPage - 2);
                const endPage = Math.min(totalPages, currentPage + 2);

                if (startPage > 1) html += '<span style="padding: 0.75rem;">...</span>';

                for (let i = startPage; i <= endPage; i++) {
                    html += `<button onclick="window.dataApp.goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
                }

                if (endPage < totalPages) html += '<span style="padding: 0.75rem;">...</span>';

                html += '<button onclick="window.dataApp.goToPage(' + (currentPage + 1) + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>›</button>';
                html += '<button onclick="window.dataApp.goToPage(' + totalPages + ')" ' + (currentPage === totalPages ? 'disabled' : '') + '>»</button>';

                controls.innerHTML = html;
            }

            function updateStats() {
                const statsContainer = document.getElementById('stats-container');
                const total = filteredData.length;
                const laki = filteredData.filter(d => d.jk === 'L').length;
                const perempuan = filteredData.filter(d => d.jk === 'P').length;

                statsContainer.innerHTML = `
                    <div class="stat-card">
                        <div class="label">Total Jemaat</div>
                        <div class="value">${total.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Laki-laki</div>
                        <div class="value">${laki}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Perempuan</div>
                        <div class="value">${perempuan}</div>
                    </div>
                `;
            }

            function updateLastUpdate() {
                const now = new Date();
                document.getElementById('update-time').textContent = now.toLocaleString('id-ID');
            }

            function showStatus(message, type, timeout = 0) {
                const el = document.getElementById('status-message');
                el.textContent = message;
                el.className = `status-message show ${type}`;
                
                if (timeout > 0) {
                    setTimeout(() => {
                        el.classList.remove('show');
                    }, timeout);
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Expose public methods
            window.dataApp = {
                goToPage: function(page) {
                    const totalPages = Math.ceil(filteredData.length / itemsPerPage);
                    if (page >= 1 && page <= totalPages) {
                        currentPage = page;
                        renderTable();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },
                resetSearch: function() {
                    document.getElementById('search-input').value = '';
                    filteredData = [...allData];
                    currentPage = 1;
                    renderTable();
                    updateStats();
                },
                refreshData: function() {
                    loadData();
                }
            };

            document.getElementById('search-input').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                
                if (query === '') {
                    filteredData = [...allData];
                } else {
                    filteredData = allData.filter(row => {
                        return Object.values(row).some(val => 
                            String(val).toLowerCase().includes(query)
                        );
                    });
                }
                
                currentPage = 1;
                renderTable();
                updateStats();
            });

            window.addEventListener('load', loadData);
        })();
    </script>
</body>
</html>
